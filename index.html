<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ------------------------------------------------------------------ constants
const W = 640, H = 900;              // logical size
const S0 = 20, S1 = 620, C = 320;    // painting square + its centre
const PAPER = '#F8F6F0', BG = '#ECE8DE', INK = '#141414', MUTED = '#8C877C';
const COL = { red: '#D52A1E', blue: '#1E3E93', yellow: '#F3C21A' };
const WEIGHT = { red: 1.0, blue: 1.25, yellow: 0.6 };    // visual weight per colour
const NOTES = { red: [261.63, 392.0, 523.25], blue: [196.0, 293.66, 349.23], yellow: [329.63, 440.0, 466.16] };
const G = 1500, BALL_R = 9, MAXV = 2400;
const LINE_R = 5, FRAME_R = 7, FUNNEL_R = 4;
const LP = { x: 212, y: 796 }, RP = { x: 428, y: 796 };  // flipper pivots
const STEP = 1 / 720;                 // physics substep
const ROT_DUR = 0.55, CHARGE = 0.45, ROT_COOLDOWN = 1.2;
const GOAL = 1;                       // at least one painted cell
// balanced zone shrinks with each composition: 20, 17, 14, 11, 9, 8 … px (v1 was a fixed 18)
let finaleTol = 8;
const tol = () => (comp && comp.finale) ? finaleTol : Math.max(8, 20 - (compNo - 1) * 3 - (compNo > 4 ? 1 : 0));

// ------------------------------------------------------------------ canvas
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------------ utils
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const snap = v => Math.round(v / 10) * 10;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// ------------------------------------------------------------------ composition generator
// A Mondrian-like recursive partition. Every dividing line gets 1–2 gaps so the ball can pass.
function makeLine(x0, y0, x1, y1, rnd) {
  const L = Math.hypot(x1 - x0, y1 - y0), n = L > 330 ? 2 : 1, gaps = [];
  for (let i = 0; i < n; i++) {
    const gw = 62 + rnd() * 22, lo = i * L / n, hi = (i + 1) * L / n;
    const c = lo + gw / 2 + rnd() * Math.max(0, hi - lo - gw);
    gaps.push([c - gw / 2, c + gw / 2]);

  const pieces = []; let t = 0;
  for (const g of gaps) { if (g[0] - t > 4) pieces.push([t, g[0]]); t = g[1]; }

}

function tryGenerate(seed, force) {

    if (vert) { const x = snap(x0 + w * (0.28 + rnd() * 0.44)); lines.push(makeLine(x, y0, x, y1, rnd)); split(x0, y0, x, y1, d + 1); split(x, y0, x1, y1, d + 1); }
    else      { const y = snap(y0 + h * (0.28 + rnd() * 0.44)); lines.push(makeLine(x0, y, x1, y, rnd)); split(x0, y0, x1, y, d + 1); split(x0, y, x1, y1, d + 1); }
  })(S0, S0, S1, S1, 0);

  leaves.forEach((l, i) => Object.assign(l, { id: i, adj: new Set(), solid: null, color: null, prevColor: null, prog: 0, progColor: null, fillT: 1, flash: 0, w: null }));
  const leafAt = (x, y) => leaves.find(l => x > l.x0 && x < l.x1 && y > l.y0 && y < l.y1);
  for (const ln of lines) {
    const dx = (ln.x1 - ln.x0) / ln.L, dy = (ln.y1 - ln.y0) / ln.L, nx = -dy, ny = dx;
    for (const g of ln.gaps) {
      const c = (g[0] + g[1]) / 2, px = ln.x0 + dx * c, py = ln.y0 + dy * c;
      const a = leafAt(px + nx * 12, py + ny * 12), b = leafAt(px - nx * 12, py - ny * 12);
      if (a && b && a !== b) { a.adj.add(b); b.adj.add(a); }
    }
  }
  // all open cells must be reachable, and every edge must have an open cell (any edge can become the bottom)
  const connectedOK = () => {
    const open = leaves.filter(l => !l.solid); if (!open.length) return false;
    const seen = new Set([open[0]]), q = [open[0]];
    while (q.length) { const l = q.pop(); for (const n of l.adj) if (!n.solid && !seen.has(n)) { seen.add(n); q.push(n); } }
    if (seen.size !== open.length) return false;
    return [l => l.x0 === S0, l => l.x1 === S1, l => l.y0 === S0, l => l.y1 === S1].every(f => open.some(f));
  };
  if (!connectedOK() && !force) return null;

  const cands = leaves.filter(l => { const w = l.x1 - l.x0, h = l.y1 - l.y0; return Math.min(w, h) >= 60 && w * h <= 50000; });
  for (let i = cands.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cands[i], cands[j]] = [cands[j], cands[i]]; }
  const palette = ['red', 'blue', 'yellow', rnd() < 0.5 ? 'red' : 'blue'];
  let placed = 0;
  for (const l of cands) {
    if (placed >= palette.length) break;
    l.solid = palette[placed];
    if (connectedOK() || force) placed++; else l.solid = null;
  }
  // A gap must always be a real passage: close every gap that opens onto a solid colour block
  // (checked along the whole gap, not just its middle), then re-check that every open cell is still reachable.
  for (const ln of lines) {
    const dx = (ln.x1 - ln.x0) / ln.L, dy = (ln.y1 - ln.y0) / ln.L, nx = -dy, ny = dx;
    // line ends that meet this line (T-junctions), as distances along it
    const joins = [];
    for (const o of lines) if (o !== ln) for (const [ex, ey] of [[o.x0, o.y0], [o.x1, o.y1]]) {
      const t = (ex - ln.x0) * dx + (ey - ln.y0) * dy, off = Math.abs((ex - ln.x0) * nx + (ey - ln.y0) * ny);
      if (off < 2 && t > 0 && t < ln.L) joins.push(t);
    }
    const okGap = g => {
      if (g[0] < 0 || g[1] > ln.L) return false;
      if (joins.some(t => t > g[0] - 14 && t < g[1] + 14)) return false;   // a meeting line would cut the doorway in half
      for (let k = 0; k <= 4; k++) {                                        // must open onto open cells on both sides
        const c = g[0] + (g[1] - g[0]) * (0.1 + 0.2 * k), px = ln.x0 + dx * c, py = ln.y0 + dy * c;
        const a = leafAt(px + nx * 12, py + ny * 12), b = leafAt(px - nx * 12, py - ny * 12);
        if (!a || !b || a.solid || b.solid) return false;
      }
      return true;
    };
    // keep good gaps; slide bad ones along the line to the nearest good spot; drop only if there is none
    ln.gaps = ln.gaps.map(g => {
      if (okGap(g)) return g;
      const w = g[1] - g[0], c0 = (g[0] + g[1]) / 2;
      for (let d = 8; d < ln.L; d += 8) for (const c of [c0 + d, c0 - d]) { const ng = [c - w / 2, c + w / 2]; if (okGap(ng)) return ng; }
      return null;
    }).filter(Boolean).sort((a, b) => a[0] - b[0]);
    const pieces = []; let t = 0;
    for (const g of ln.gaps) { if (g[0] - t > 4) pieces.push([t, g[0]]); t = Math.max(t, g[1]); }
    if (ln.L - t > 4) pieces.push([t, ln.L]);
    ln.pieces = pieces;
  }
  for (const l of leaves) l.adj.clear();
  for (const ln of lines) {
    const dx = (ln.x1 - ln.x0) / ln.L, dy = (ln.y1 - ln.y0) / ln.L, nx = -dy, ny = dx;
    for (const g of ln.gaps) {
      const c = (g[0] + g[1]) / 2, px = ln.x0 + dx * c, py = ln.y0 + dy * c;
      const a = leafAt(px + nx * 12, py + ny * 12), b = leafAt(px - nx * 12, py - ny * 12);
      if (a && b && a !== b) { a.adj.add(b); b.adj.add(a); }
    }
  }
  if (!force && !connectedOK()) return null;
  if (!force && (placed < 3 || leaves.filter(l => !l.solid).length < 6)) return null;
  return { lines, leaves, seed };
}
function generate(seed) {
  for (let a = 0; a < 150; a++) { const c = tryGenerate(seed * 101 + a); if (c) return c; }
  return tryGenerate(seed, true);
}

// ------------------------------------------------------------------ world (composition rotated by K quarter-turns)
const FIXED = [
  { ax: S0, ay: S0, bx: S1, by: S0, r: FRAME_R },
  { ax: S0, ay: S0, bx: S0, by: S1, r: FRAME_R },
  { ax: S1, ay: S0, bx: S1, by: S1, r: FRAME_R },
  { ax: S0, ay: S1, bx: LP.x, by: LP.y, r: FUNNEL_R },
  { ax: S1, ay: S1, bx: RP.x, by: RP.y, r: FUNNEL_R },
];
function rp(x, y, k) { let dx = x - C, dy = y - C; for (let i = 0; i < k; i++) { const t = dx; dx = -dy; dy = t; } return [C + dx, C + dy]; }
function rr(r, k) { const a = rp(r.x0, r.y0, k), b = rp(r.x1, r.y1, k); return { x0: Math.min(a[0], b[0]), y0: Math.min(a[1], b[1]), x1: Math.max(a[0], b[0]), y1: Math.max(a[1], b[1]) }; }

let comp, K = 0, compNo = 1;
const world = { segs: [], solids: [], cells: [] };
function buildWorld() {
  world.segs = FIXED.slice(); world.solids = []; world.cells = [];
  for (const ln of comp.lines) {
    const dx = (ln.x1 - ln.x0) / ln.L, dy = (ln.y1 - ln.y0) / ln.L;
    for (const p of ln.pieces) {
      const a = rp(ln.x0 + dx * p[0], ln.y0 + dy * p[0], K), b = rp(ln.x0 + dx * p[1], ln.y0 + dy * p[1], K);
      world.segs.push({ ax: a[0], ay: a[1], bx: b[0], by: b[1], r: LINE_R, inner: true });
    }
  }
  for (const l of comp.leaves) { const r = rr(l, K); r.leaf = l; l.w = r; (l.solid ? world.solids : world.cells).push(r); }
}

// ------------------------------------------------------------------ ball + flippers
const B = { x: C, y: 60, vx: 0, vy: 0, r: BALL_R, color: null, alive: false };
const trail = [];
const FL = { L: 92, px: LP.x, py: LP.y, rest: 0.50, up: -0.40, th: 0.50, w: 0 };
const FR = { L: 92, px: RP.x, py: RP.y, rest: Math.PI - 0.50, up: Math.PI + 0.40, th: Math.PI - 0.50, w: 0 };

function updateFlipper(f, held, dt) {
  const target = held ? f.up : f.rest, sp = held ? 24 : 15, prev = f.th, diff = target - f.th, step = sp * dt;
  f.th = Math.abs(diff) <= step ? target : f.th + Math.sign(diff) * step;
  f.w = (f.th - prev) / dt;
}

let wallSoundCd = 0;
function collideSeg(s) {
  const abx = s.bx - s.ax, aby = s.by - s.ay;
  const t = clamp(((B.x - s.ax) * abx + (B.y - s.ay) * aby) / (abx * abx + aby * aby), 0, 1);
  const px = s.ax + abx * t, py = s.ay + aby * t;
  const dx = B.x - px, dy = B.y - py, d2 = dx * dx + dy * dy, R = B.r + s.r;
  if (d2 >= R * R) return;
  const d = Math.sqrt(d2) || 1e-4, nx = dx / d, ny = dy / d;
  B.x = px + nx * R; B.y = py + ny * R;
  const vn = B.vx * nx + B.vy * ny;
  if (vn < 0) {
    B.vx -= 1.5 * vn * nx; B.vy -= 1.5 * vn * ny;           // restitution 0.5
    B.vx *= 0.9995; B.vy *= 0.9995;
    if (vn < -280 && wallSoundCd <= 0) { tone(1500, 0.03, 0.04, 'sine'); wallSoundCd = 0.05; }
  }
}
function collideBox(r) {
  const x0 = r.x0 - LINE_R, y0 = r.y0 - LINE_R, x1 = r.x1 + LINE_R, y1 = r.y1 + LINE_R;
  const cx = clamp(B.x, x0, x1), cy = clamp(B.y, y0, y1), dx = B.x - cx, dy = B.y - cy, d2 = dx * dx + dy * dy;
  let nx, ny, pen;
  if (d2 === 0) {
    // never push the ball out through a side that sits against the outer frame
    const l = r.x0 <= S0 + 1 ? Infinity : B.x - x0, rt = r.x1 >= S1 - 1 ? Infinity : x1 - B.x;
    const t = r.y0 <= S0 + 1 ? Infinity : B.y - y0, b = y1 - B.y, m = Math.min(l, rt, t, b);
    if (m === l) { nx = -1; ny = 0; pen = l + B.r; } else if (m === rt) { nx = 1; ny = 0; pen = rt + B.r; }
    else if (m === t) { nx = 0; ny = -1; pen = t + B.r; } else { nx = 0; ny = 1; pen = b + B.r; }
  } else {
    if (d2 >= B.r * B.r) return;
    const d = Math.sqrt(d2); nx = dx / d; ny = dy / d; pen = B.r - d;
  }
  B.x += nx * pen; B.y += ny * pen;
  const vn = B.vx * nx + B.vy * ny;
  if (vn < 0) {
    B.vx -= 1.75 * vn * nx; B.vy -= 1.75 * vn * ny;          // restitution 0.75
    if (vn < -60) { B.vx += nx * 380; B.vy += ny * 380; hitBumper(r.leaf); }
  }
}
function collideFlipper(f) {
  const c = Math.cos(f.th), s = Math.sin(f.th);
  const rx = B.x - f.px, ry = B.y - f.py, t = clamp((rx * c + ry * s) / f.L, 0, 1);
  const qx = f.px + c * f.L * t, qy = f.py + s * f.L * t, R = B.r + (12 - 5 * t);
  const dx = B.x - qx, dy = B.y - qy, d2 = dx * dx + dy * dy;
  if (d2 >= R * R) return;
  const d = Math.sqrt(d2) || 1e-4, nx = dx / d, ny = dy / d;
  B.x = qx + nx * R; B.y = qy + ny * R;
  const ox = B.x - f.px, oy = B.y - f.py, vsx = -f.w * oy, vsy = f.w * ox;   // flipper surface velocity
  let vrx = B.vx - vsx, vry = B.vy - vsy; const vn = vrx * nx + vry * ny;
  if (vn < 0) { vrx -= 1.35 * vn * nx; vry -= 1.35 * vn * ny; B.vx = vrx + vsx; B.vy = vry + vsy; }
}
function physStep(dt) {
  B.vy += G * dt; B.x += B.vx * dt; B.y += B.vy * dt;
  for (const r of world.solids) collideBox(r);
  for (const s of world.segs) collideSeg(s);

  const sp = Math.hypot(B.vx, B.vy); if (sp > MAXV) { B.vx *= MAXV / sp; B.vy *= MAXV / sp; }
  // safety net: the ball can never leave the table through the frame
  const lo = S0 + FRAME_R + B.r, hi = S1 - FRAME_R - B.r;
  if (B.y < lo) { B.y = lo; B.vy = Math.abs(B.vy) * 0.5; }
  if (B.x < lo) { B.x = lo; B.vx = Math.abs(B.vx) * 0.5; }
  if (B.x > hi) { B.x = hi; B.vx = -Math.abs(B.vx) * 0.5; }
}

function hitBumper(leaf) {
  leaf.flash = 1;
  B.color = leaf.solid;
  hitNote(leaf.solid);
  shake = Math.min(shake + 2.5, 6);
}

function freeAt(x, y) {
  for (const r of world.solids) if (x > r.x0 - 16 && x < r.x1 + 16 && y > r.y0 - 16 && y < r.y1 + 16) return false;
  for (const s of world.segs) {
    const abx = s.bx - s.ax, aby = s.by - s.ay, t = clamp(((x - s.ax) * abx + (y - s.ay) * aby) / (abx * abx + aby * aby), 0, 1);
    if (Math.hypot(x - s.ax - abx * t, y - s.ay - aby * t) < B.r + s.r + 4) return false;
  }

}
function spawnBall() {
  let x = C, y = S0 + 30;
  outer: for (y = S0 + 30; y < S1 - 30; y += 30) for (const o of [0, 40, -40, 80, -80, 120, -120, 160, -160, 200, -200, 240, -240]) if (freeAt(C + o, y)) { x = C + o; break outer; }
  Object.assign(B, { x, y, vx: (Math.random() - .5) * 120, vy: 0, color: null, alive: true });
  trail.length = 0; still = 0;
}

// ------------------------------------------------------------------ balance
function balance() {
  let sw = 0, sx = 0, n = 0;
  if (comp.finale) {                       // the wall: each hung painting weighs what you painted into it
    for (const l of comp.leaves) if (l.tile != null && l.hung) { n++; sw += l.weight; sx += l.weight * (l.w.x0 + l.w.x1) / 2; }
    return { dx: sw ? sx / sw - C : 0, painted: n };
  }
  for (const l of comp.leaves) {
    const c = l.solid || l.color; if (!c) continue; if (!l.solid) n++;
    const r = l.w, a = (r.x1 - r.x0) * (r.y1 - r.y0) * WEIGHT[c];
    sw += a; sx += a * (r.x0 + r.x1) / 2;
  }
  return { dx: sw ? sx / sw - C : 0, painted: n };
}
function checkBalance() {
  const b = balance();
  if (b.painted >= GOAL && Math.abs(b.dx) < tol() && state === 'play') startWin();
}

// ------------------------------------------------------------------ audio (all synthesized)
let AC = null, master = null;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
let muted = false;
function tone(freq, dur, vol, type = 'triangle', when = 0, toFreq) {
  if (muted) return;
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

function piano(f, vol = 0.22, when = 0) { tone(f, 0.7, vol, 'triangle', when); tone(f * 2, 0.25, vol * 0.3, 'sine', when); }
const BEAT = 60 / 100, PROG = [0, 0, 0, 0, 5, 5, 0, 0, 7, 5, 0, 7], WALK = [0, 4, 7, 9, 10, 9, 7, 4];
const VOICE = { blue: [-12, -8, -5, -2], red: [0, 4, 7, 10], yellow: [7, 10, 12, 16] };
let musNext = 0, musStep = 0;
function musicTick() {
  if (!AC || muted || AC.state !== 'running') { musNext = 0; return; }
  if (musNext < AC.currentTime) musNext = AC.currentTime + 0.06;
  while (musNext < AC.currentTime + 0.2) {
    const bar = Math.floor(musStep / 8) % 12, i = musStep % 8, f = 65.41 * Math.pow(2, (PROG[bar] + WALK[i]) / 12), w = musNext - AC.currentTime;
    tone(f * 2, 0.34, 0.055, 'sine', w);
    musNext += i % 2 === 0 ? BEAT * 0.58 : BEAT * 0.42; musStep++;          // swung eighths
  }
}
const onBeat = () => { if (!AC || !musNext) return 0; const w = musNext - AC.currentTime; return w > 0 && w < 0.13 ? w : 0; };
const curRoot = () => PROG[Math.floor(Math.max(0, musStep - 1) / 8) % 12];
function hitNote(color) {
  const v = VOICE[color], t = v[Math.floor(Math.random() * v.length)];
  piano(261.63 * Math.pow(2, (curRoot() + t) / 12), 0.2, onBeat());
}
function chord(color) { const w = onBeat(); VOICE[color].forEach((t, i) => piano(261.63 * Math.pow(2, (curRoot() + t) / 12), 0.11, w + i * 0.05)); }

// ------------------------------------------------------------------ input
const held = {}, touches = new Map();
const LEFT = ['ShiftLeft', 'KeyZ', 'ArrowLeft'], RIGHT = ['ShiftRight', 'Slash', 'ArrowRight'];
// Work out which side a key belongs to. Shift is matched by code, by key+location and by keyCode,
// because some keyboards / input methods report it differently.
let lastKey = '';
function sideCode(e) {
  if (LEFT.includes(e.code) || RIGHT.includes(e.code)) return e.code;
  const isShift = e.key === 'Shift' || e.keyCode === 16;
  if (isShift && e.location === 1) return 'ShiftLeft';
  if (isShift && e.location === 2) return 'ShiftRight';
  if (e.key === 'z' || e.key === 'Z') return 'KeyZ';
  if (e.key === '/') return 'Slash';

}
addEventListener('keydown', e => {
  lastKey = `${e.code || '—'} · ${e.key} · loc ${e.location}`;
  if (state === 'gallery') {

  ctx.font = `${weight} ${size}px "Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if ('letterSpacing' in ctx) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(s, x, y);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function drawHUD() {
  if (state === 'title') return;
  const b = balance();
  if (state === 'gallery') return;
  txt('COMPOSITION No. ' + compNo, 28, 832, 13, INK, 'left', 700, 2);
  for (let i = 0; i < TOTAL; i++) {
    const x = 28 + i * 12, y = 841;
    if (i < compNo - 1 || collection[i]) { ctx.fillStyle = INK; ctx.fillRect(x, y, 8, 8); }
    else if (i === compNo - 1) { ctx.fillStyle = COL.red; ctx.fillRect(x, y, 8, 8); }
    else { ctx.strokeStyle = '#C9C3B5'; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.75, y + 0.75, 6.5, 6.5); }
  }
  // v1 balance beam, unlabelled
  const bx = 110, by = 878;
  ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(bx, by - 2); ctx.lineTo(bx - 7, by + 10); ctx.lineTo(bx + 7, by + 10); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.translate(bx, by - 3); ctx.rotate(beam);
  const t = tol(), ok = Math.abs(b.dx) < t;
  ctx.fillStyle = ok ? COL.red : INK; ctx.fillRect(-72, -2, 144, 3);
  // the balanced zone, as a red strip on the beam that gets narrower each composition
  const tz = t * 72 / 90; ctx.fillStyle = COL.red; ctx.fillRect(-tz, 1, tz * 2, 3);
  const mx = clamp(b.dx, -90, 90) * 72 / 90;
  ctx.fillStyle = INK; ctx.fillRect(mx - 4, -10, 8, 8);
  ctx.restore();
  // rotation readiness ring
  ctx.fillStyle = INK; ctx.fillRect(PBTN.x, PBTN.y, 5, PBTN.h); ctx.fillRect(PBTN.x + 11, PBTN.y, 5, PBTN.h);
  const cx = 596, cy = 870;
  ctx.lineWidth = 3; ctx.strokeStyle = '#D6D1C4'; ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 7); ctx.stroke();
  const p = rotCd > 0 ? 1 - rotCd / ROT_COOLDOWN : charge / CHARGE;
  ctx.strokeStyle = rotCd > 0 ? MUTED : INK; ctx.beginPath(); ctx.arc(cx, cy, 11, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();

  if (!document.hasFocus()) {
    ctx.fillStyle = INK; ctx.fillRect(C - 130, 6, 260, 28);
    txt('CLICK TO USE THE KEYBOARD', C, 24, 11, PAPER, 'center', 700, 2.5);
  }
  if (state === 'play' && still > 1.4 && B.alive) txt('HOLD BOTH SHIFTS', C, 650, 11, MUTED, 'center', 700, 2.5);
}

// shift-key glyph, drawn so it matches the line weight of the keycaps
function shiftGlyph(cx, cy, k = 1) {
  ctx.beginPath();
  ctx.moveTo(cx, cy - 8 * k); ctx.lineTo(cx + 8 * k, cy); ctx.lineTo(cx + 4 * k, cy); ctx.lineTo(cx + 4 * k, cy + 7 * k);
  ctx.lineTo(cx - 4 * k, cy + 7 * k); ctx.lineTo(cx - 4 * k, cy); ctx.lineTo(cx - 8 * k, cy); ctx.closePath();
  ctx.lineJoin = 'miter'; ctx.stroke();
}
function keycap(x, y, w) {
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, 38);
  shiftGlyph(x + w / 2, y + 20);
}

function drawGallery() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  const L = 80, R = 560, top = 158, size = R - L, g = 8, tile = (size - 4 * g) / 3, foot = 34;
  txt('YOUR COLLECTION', L - 2, 92, 28, INK, 'left', 700, 4);
  txt('NINE COMPOSITIONS IN BALANCE', L, 116, 11, MUTED, 'left', 700, 2.5);
  // hung from one nail: it starts crooked and swings level
  const nail = { x: C, y: top - 18 }, ang = -0.11 * Math.exp(-1.7 * galT) * Math.cos(4.4 * galT);
  ctx.save(); ctx.translate(nail.x, nail.y); ctx.rotate(ang); ctx.translate(-nail.x, -nail.y);
  ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(L + 90, top); ctx.lineTo(nail.x, nail.y); ctx.lineTo(R - 90, top); ctx.stroke();
  ctx.fillStyle = INK; ctx.fillRect(L, top, size, size + foot);
  collection.forEach((im, i) => {
    const a = clamp((galT - 0.15 * i) / 0.35, 0, 1); if (a <= 0 || !im) return;      // tiles arrive one by one
    const x = L + g + (i % 3) * (tile + g), y = top + g + Math.floor(i / 3) * (tile + g);
    ctx.globalAlpha = a; ctx.drawImage(im, x, y, tile, tile); ctx.globalAlpha = 1;
  });
  txt('COUNTERWEIGHT', L + g, top + size + 21, 10, PAPER, 'left', 700, 3);
  const cursor = Math.floor(time * 2) % 2 === 0 && sig.length < 3 ? '_' : '';
  if (sig || cursor) txt(sig + cursor, R - g, top + size + 23, 15, PAPER, 'right', 700, 3);
  ctx.restore();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(nail.x, nail.y, 4, 0, 7); ctx.fill();
  GBTN.forEach((b, i) => {
    const hov = galHover === i;
    if (i === 0) { ctx.fillStyle = hov ? COL.red : INK; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.fillStyle = hov ? INK : COL.red; ctx.fillRect(b.x + b.w - 16, b.y, 16, b.h); txt(b.label, b.x + 24, b.y + 35, 14, PAPER, 'left', 700, 4); }
    else { ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2); if (hov) { ctx.fillStyle = INK; ctx.fillRect(b.x, b.y, b.w, b.h); } txt(b.label, b.x + 24, b.y + 35, 14, hov ? PAPER : INK, 'left', 700, 4); }
  });
  ctx.fillStyle = INK; ctx.fillRect(L, 812, R - L, 1);
  txt('Type your initials to sign it. Enter to play again.', L, 840, 12, MUTED, 'left', 500);
}

function drawPause() {
  ctx.fillStyle = 'rgba(248,246,240,0.86)'; ctx.fillRect(0, 0, W, H);
  txt('PAUSED', MENU_X, MENU_Y0 - 84, 11, MUTED, 'left', 700, 2.5);
  MENU.forEach((m, i) => {
    const y = MENU_Y0 + i * MENU_DY, sel = i === menuSel;
    if (sel) { ctx.fillStyle = COL.red; ctx.fillRect(MENU_X - 36, y - 22, 16, 16); }
    txt(m.label(), MENU_X, y, 30, sel ? INK : MUTED, 'left', 700, 5);
  });
  txt('ESC TO RESUME', MENU_X, MENU_Y0 + MENU.length * MENU_DY + 24, 11, MUTED, 'left', 700, 2.5);
}

function drawTitle() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  const L = 80, R = 560;                          // one column: 80 px margins

  // motif: a small Mondrian on the same column
  ctx.fillStyle = COL.red;    ctx.fillRect(L, 112, 142, 130);
  ctx.fillStyle = COL.yellow; ctx.fillRect(230, 250, 64, 62);
  ctx.fillStyle = COL.blue;   ctx.fillRect(480, 250, R - 480, 62);
  ctx.fillStyle = INK;
  ctx.fillRect(222, 112, 8, 200);                 // vertical
  ctx.fillRect(472, 112, 8, 200);                 // vertical
  ctx.fillRect(L, 242, R - L, 8);                 // horizontal
  ctx.fillRect(480, 176, R - 480, 8);             // short horizontal

  // title — the one large thing on the page
  txt('COUNTERWEIGHT', L - 3, 412, 48, INK, 'left', 700, 4);

  // controls as keycaps, labels underneath in caption style
  const y = 470;
  keycap(L, y, 56);           txt('LEFT', L, y + 62, 11, MUTED, 'left', 700, 2.5);
  keycap(L + 96, y, 56);      txt('RIGHT', L + 96, y + 62, 11, MUTED, 'left', 700, 2.5);
  keycap(L + 192, y, 56); keycap(L + 276, y, 56);
  txt('+', L + 262, y + 26, 18, INK, 'center', 500);
  txt('HOLD BOTH', L + 192, y + 62, 11, MUTED, 'left', 700, 2.5);

  // primary action
  ctx.fillStyle = btnHover ? COL.red : INK; ctx.fillRect(BTN.x, BTN.y, BTN.w, BTN.h);
  ctx.fillStyle = btnHover ? INK : COL.red; ctx.fillRect(BTN.x + BTN.w - 16, BTN.y, 16, BTN.h);
  txt('START', BTN.x + 28, BTN.y + 35, 16, PAPER, 'left', 700, 6);

  // footer: smallest, quietest
  ctx.fillStyle = INK; ctx.fillRect(L, 812, R - L, 1);
  txt('Or use Z and /, or tap either half of the screen. Esc to pause.', L, 840, 12, MUTED, 'left', 500);
}

function render() {
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);

  // table paper (painting + funnel)
  ctx.fillStyle = PAPER;
  ctx.beginPath(); ctx.moveTo(S0, S0); ctx.lineTo(S1, S0); ctx.lineTo(S1, S1); ctx.lineTo(RP.x, RP.y); ctx.lineTo(RP.x, H); ctx.lineTo(LP.x, H); ctx.lineTo(LP.x, LP.y); ctx.lineTo(S0, S1); ctx.closePath(); ctx.fill();

  // painting (rotates as one object)
  ctx.save();
  ctx.beginPath(); ctx.rect(S0, S0, S1 - S0, S1 - S0); ctx.clip();
  let alpha = 1;
  if (state === 'rotate') {
    const t = rotT / ROT_DUR, a = easeInOut(t) * Math.PI / 2, sc = 1 - 0.1 * Math.sin(Math.PI * t);
    ctx.translate(C, C); ctx.rotate(a); ctx.scale(sc, sc); ctx.translate(-C, -C);
  }
  if (state === 'win') alpha = winT < 1.0 ? 1 : winT < 1.4 ? 1 - (winT - 1.0) / 0.4 : clamp((winT - 1.4) / 0.5, 0, 1);
  ctx.globalAlpha = alpha;
  drawComposition();
  ctx.globalAlpha = 1;
  if (state === 'rotate' && ballInSq) drawBall();
  ctx.restore();

  // fixed frame + funnel
  ctx.strokeStyle = INK; ctx.lineCap = 'square'; ctx.lineWidth = FRAME_R * 2;
  ctx.beginPath(); ctx.moveTo(S0, S1); ctx.lineTo(S0, S0); ctx.lineTo(S1, S0); ctx.lineTo(S1, S1); ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineWidth = FUNNEL_R * 2;
  ctx.beginPath(); ctx.moveTo(S0, S1); ctx.lineTo(LP.x, LP.y); ctx.moveTo(S1, S1); ctx.lineTo(RP.x, RP.y); ctx.stroke();

  drawFlipper(FL); drawFlipper(FR);
  if (!(state === 'rotate' && ballInSq) && state !== 'win') drawBall();

  if (state === 'win' && winT < 1.4) {
    ctx.fillStyle = INK; ctx.fillRect(S0, C - 34, S1 - S0, 68);
    txt('BALANCED', C, C + 12, 32, PAPER, 'center', 700, 12);
  }
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'pause') drawPause();
  if (state === 'gallery') drawGallery();
}

// ------------------------------------------------------------------ boot
comp = generate(1007); buildWorld();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__cwb = { get finaleTol() { return finaleTol; }, get sig() { return sig; }, startGame, endRotate, newComposition, get K() { return K; }, get collection() { return collection; }, snapshot, startWin, get compNo() { return compNo; }, set compNo(v) { compNo = v; }, physStep, B, world, get state() { return state; }, get comp() { return comp; }, balance, held, update, startRotate };
})();
</script>
